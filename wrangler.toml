name = "residualmap-bot"
main = "src/worker.js"
compatibility_date = "2026-04-30"
workers_dev = true

[vars]
DEFAULT_CURRENCY = "KZT"
DEFAULT_TIMEZONE = "Asia/Qyzylorda"
OPENAI_MODEL_PARSE = "gpt-5.4-mini"
OPENAI_MODEL_ANALYTICS = "gpt-5.4-mini"
MINI_APP_URL = "https://your-worker.example/app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "residualmap_expenses"
database_id = "replace_with_your_cloudflare_d1_database_id"
migrations_dir = "migrations"
