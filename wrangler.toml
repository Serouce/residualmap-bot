name = "residualmap-bot"
main = "src/worker.js"
compatibility_date = "2026-04-30"
workers_dev = true

[vars]
DEFAULT_CURRENCY = "KZT"
DEFAULT_TIMEZONE = "Asia/Qyzylorda"
OPENAI_MODEL_PARSE = "gpt-5.4-mini"
OPENAI_MODEL_ANALYTICS = "gpt-5.4-mini"
MINI_APP_URL = "https://residualmap-bot.residualmap.workers.dev/app"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "residualmap_expenses"
database_id = "0ffa30e8-7e37-4f58-b06c-c03baa38872e"
migrations_dir = "migrations"
