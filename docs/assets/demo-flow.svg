<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ResidualMap Bot self-hosted data flow</title>
  <desc id="desc">A synthetic architecture flow showing Telegram, Cloudflare Worker, D1, and optional OpenAI parsing.</desc>
  <rect width="960" height="540" fill="#f5f7f8"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263238">Self-hosted data flow</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="16" fill="#607076">Each operator deploys their own bot, Worker, and database.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607076"/>
    </marker>
  </defs>

  <rect x="70" y="178" width="190" height="112" rx="10" fill="#ffffff" stroke="#ced9dd"/>
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">Telegram</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="14" fill="#607076">Your bot token</text>
  <text x="100" y="272" font-family="Arial, sans-serif" font-size="14" fill="#607076">Your allowlist</text>

  <rect x="382" y="178" width="206" height="112" rx="10" fill="#ffffff" stroke="#ced9dd"/>
  <text x="414" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">Cloudflare Worker</text>
  <text x="414" y="250" font-family="Arial, sans-serif" font-size="14" fill="#607076">/telegram webhook</text>
  <text x="414" y="272" font-family="Arial, sans-serif" font-size="14" fill="#607076">/app Mini App</text>

  <rect x="700" y="178" width="190" height="112" rx="10" fill="#ffffff" stroke="#ced9dd"/>
  <text x="736" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">D1 database</text>
  <text x="736" y="250" font-family="Arial, sans-serif" font-size="14" fill="#607076">Your account</text>
  <text x="736" y="272" font-family="Arial, sans-serif" font-size="14" fill="#607076">Your records</text>

  <rect x="382" y="366" width="206" height="96" rx="10" fill="#ffffff" stroke="#ced9dd"/>
  <text x="424" y="406" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">OpenAI</text>
  <text x="414" y="436" font-family="Arial, sans-serif" font-size="14" fill="#607076">Optional parsing</text>

  <line x1="260" y1="234" x2="374" y2="234" stroke="#607076" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="588" y1="234" x2="692" y2="234" stroke="#607076" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="485" y1="290" x2="485" y2="358" stroke="#607076" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <text x="70" y="500" font-family="Arial, sans-serif" font-size="14" fill="#607076">No central ResidualMap database is provided by this template.</text>
</svg>
